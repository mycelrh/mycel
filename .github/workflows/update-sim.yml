name: Update simulation

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest COIN data
        run: node sim/fetch-coin-data.js

      - name: Run simulation
        run: node sim/mycel-sim.js

      - name: Recompute verify.html hashes
        run: node .github/scripts/update-verify-hashes.js

      - name: Commit updated data if changed
        run: |
          git config user.name "mycel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sim/coin-daily.csv sim/fossil-record.json sim/summary.json verify.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
